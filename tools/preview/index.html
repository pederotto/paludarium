<!doctype html><html><head><meta charset="utf-8"><title>Asset preview</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<style>body{margin:0;background:#222;color:#ddd;font:12px sans-serif}</style></head><body>
<div id="loading">…</div>
<script type="module">
// Dev tool: shows every model in assets/models with its size in metres.
import * as THREE from 'three/webgpu';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const r = new THREE.WebGPURenderer({ antialias: true, forceWebGL: true });
r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement); await r.init();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x303030);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3, 5, 4); scene.add(d);
const names = ['rock_moss_set_01','rock_moss_set_02','rock_face_01','root_cluster_01','fern_02','weed_plant_02','tree_stump_01','dead_tree_trunk'];
const loader = new GLTFLoader(); const info = [];
let x = 0;
for (const n of names) {
  const g = await loader.loadAsync('../../assets/models/' + n + '.glb');
  const box = new THREE.Box3().setFromObject(g.scene); const s = box.getSize(new THREE.Vector3());
  const k = 1.6 / Math.max(s.x, s.y, s.z); g.scene.scale.setScalar(k);
  const c = box.getCenter(new THREE.Vector3()).multiplyScalar(k); g.scene.position.set(x * 2 - 7, -c.y + 0.8 * 0, -c.z); g.scene.position.x -= c.x;
  scene.add(g.scene); x++;
  const meshes = []; g.scene.traverse((o) => { if (o.isMesh) meshes.push(o.name); });
  info.push(`${n}: ${s.x.toFixed(2)}×${s.y.toFixed(2)}×${s.z.toFixed(2)} m, meshes=${meshes.length} [${meshes.join(',').slice(0,120)}]`);
}
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100); cam.position.set(0, 3, 12); cam.lookAt(0, 0.3, 0);
r.setAnimationLoop(() => r.render(scene, cam));
console.warn('PREVIEW\n' + info.join('\n'));
document.getElementById('loading').classList.add('gone');
</script></body></html>
