<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paludarium</title>
<meta name="description" content="Build and simulate a living terrarium and aquarium in the browser. three.js + WebGPU.">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "camera-controls": "https://cdn.jsdelivr.net/npm/camera-controls@3.1.2/dist/camera-controls.module.js",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/build/index.module.js"
  }
}
</script>
<style>
  :root {
    --bg: #101316; --panel: rgba(20, 24, 28, 0.9); --line: rgba(255, 255, 255, 0.09); --text: #e8ecef; --dim: #93a0aa;
    --accent: #7fd1a0; --warn: #e6b84a; --bad: #e65a4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  header { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  header > * { pointer-events: auto; }
  .brand { font-weight: 700; letter-spacing: 0.02em; background: var(--panel); padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); }
  .brand small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  #clock { background: var(--panel); padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  #speed { display: flex; gap: 4px; background: var(--panel); padding: 4px; border-radius: 10px; border: 1px solid var(--line); }
  .spacer { flex: 1; }
  #views { display: flex; gap: 4px; background: var(--panel); padding: 4px; border-radius: 10px; border: 1px solid var(--line); }
  #stage { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  #stage .bar { margin: 4px 0; }
  #togglePanel { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; }

  #left { position: fixed; top: 58px; left: 10px; bottom: 44px; width: 250px; display: flex; flex-direction: column; gap: 8px; }
  #tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--panel); padding: 6px; border-radius: 12px; border: 1px solid var(--line); }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 8px; cursor: pointer; font: inherit; }
  .tool .ic { font-size: 18px; line-height: 1.1; }
  .tool .lb { font-size: 11px; color: var(--dim); }
  .tool:hover { background: rgba(255, 255, 255, 0.05); }
  .tool.on { border-color: var(--accent); background: rgba(127, 209, 160, 0.12); }
  .tool.on .lb { color: var(--text); }
  #options { background: var(--panel); padding: 10px; border-radius: 12px; border: 1px solid var(--line); overflow-y: auto; min-height: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .chip { background: rgba(255, 255, 255, 0.06); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .chip:hover { background: rgba(255, 255, 255, 0.1); }
  .chip.on { background: var(--accent); color: #0d1a12; border-color: var(--accent); }
  select.chip { appearance: none; }
  .grp { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin: 6px 0 4px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: var(--dim); }
  .row span { width: 88px; flex: none; font-size: 12px; }
  .row input { flex: 1; accent-color: var(--accent); min-width: 0; }
  .note { color: var(--dim); font-size: 12px; margin: 6px 0 0; }

  #right { position: fixed; top: 58px; right: 10px; bottom: 44px; width: 280px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .card { background: var(--panel); padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
  .card h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 600; }
  .stat { display: flex; justify-content: space-between; padding: 2px 0; font-size: 12px; }
  .stat span { color: var(--dim); }
  .stat b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.warn b { color: var(--warn); } .stat.bad b { color: var(--bad); } .stat.good b { color: var(--accent); }
  .census { display: grid; grid-template-columns: 30px 1fr 50px 36px; align-items: center; gap: 6px; font-size: 12px; padding: 2px 0; }
  .census .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .census .why { grid-column: 2 / 5; color: var(--warn); font-size: 11px; margin-top: -2px; }
  .bar { height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .bar.hunger i { background: #d08a4a; }
  .log { font-size: 12px; padding: 2px 0; color: var(--text); }
  .log i { color: var(--dim); font-style: normal; font-size: 11px; font-variant-numeric: tabular-nums; margin-right: 4px; }
  .log.bad { color: #f0a59a; } .log.good { color: #a8e6bd; } .log.eat { color: #e6d49a; }
  #inspect .sub { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  #file { display: flex; flex-wrap: wrap; gap: 4px; }

  footer { position: fixed; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  #hint { background: var(--panel); padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .meta { margin-left: auto; color: var(--dim); font-size: 11px; background: var(--panel); padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); pointer-events: auto; }
  .meta a { color: var(--dim); }
  #toast { position: fixed; left: 50%; top: 64px; transform: translate(-50%, -10px); background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; opacity: 0; transition: 0.2s; pointer-events: none; max-width: 80vw; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { border-color: var(--bad); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 50; color: var(--dim); }
  #loading.gone { display: none; }
  body.panel-hidden #left, body.panel-hidden #right { display: none; }

  @media (max-width: 800px) {
    #left { top: auto; bottom: 44px; width: auto; right: 10px; max-height: 42vh; }
    #tools { grid-template-columns: repeat(9, 1fr); }
    .tool .lb { display: none; }
    #right { display: none; }
    body.show-right #right { display: flex; left: 10px; width: auto; z-index: 5; }
    .brand small, .meta { display: none; }
  }
</style>
</head>
<body>
<div id="view"></div>
<div id="loading">Loading the tank…</div>
<header>
  <div class="brand">Paludarium <small>terrarium + aquarium simulator</small></div>
  <div id="clock">Day 1</div>
  <div id="speed" title="Simulation speed (Space pauses)"></div>
  <div class="spacer"></div>
  <div id="views" title="Camera views (double-click anything to focus on it)"></div>
  <button id="togglePanel" title="Show or hide panels (H)">Panels</button>
</header>
<aside id="left">
  <div id="tools"></div>
  <div id="options"></div>
</aside>
<aside id="right">
  <div class="card"><h3>Environment</h3><div id="stage"></div><div id="stats"></div></div>
  <div class="card"><h3>Care</h3><div id="controls"></div></div>
  <div class="card" id="inspect" hidden></div>
  <div class="card"><h3>Inhabitants</h3><div id="census"></div></div>
  <div class="card"><h3>Journal</h3><div id="log"></div></div>
  <div class="card"><h3>Tank</h3><div id="file"></div><input type="file" id="importFile" accept="application/json,.json" hidden></div>
</aside>
<footer>
  <div id="hint"></div>
  <div class="meta"><span id="backend">…</span> · <span id="fps"></span> · <a href="https://github.com/pederotto/paludarium" target="_blank" rel="noopener">source</a></div>
</footer>
<div id="toast"></div>
<script type="module">
  const fail = (e) => {
    document.getElementById('loading').innerHTML = `<div style="max-width:520px;padding:20px">Couldn't start: ${e?.message ?? e}.<br><br>Paludarium needs a browser with WebGPU or WebGL 2 (recent Chrome, Edge, Firefox or Safari) and an internet connection the first time, to load three.js.</div>`;
    console.error(e);
  };
  import('./src/main.js').then(() => document.getElementById('loading').classList.add('gone')).catch(fail);
</script>
</body>
</html>
